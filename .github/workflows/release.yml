name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form 1.2.3 (without a v prefix)." >&2
            exit 1
          fi
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${crate_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Cargo version ${crate_version} does not match tag ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-features --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: asapi_${{ github.ref_name }}_linux_amd64
          - runner: ubuntu-22.04-arm
            asset: asapi_${{ github.ref_name }}_linux_arm64
          - runner: macos-15-intel
            asset: asapi_${{ github.ref_name }}_macOS_amd64
          - runner: macos-15
            asset: asapi_${{ github.ref_name }}_macOS_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/asapi "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: asapi_*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum asapi_* > "asapi_${GITHUB_REF_NAME}_checksums.txt"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "asapi ${GITHUB_REF_NAME}" \
            --generate-notes
