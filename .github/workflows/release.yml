name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag, without a v prefix
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}
      - name: Verify release version
        shell: bash
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form 1.2.3 (without a v prefix)." >&2
            exit 1
          fi
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${crate_version}" != "${VERSION}" ]]; then
            echo "Cargo version ${crate_version} does not match tag ${VERSION}." >&2
            exit 1
          fi
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-features --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suffix: linux_amd64
          - runner: ubuntu-22.04-arm
            suffix: linux_arm64
          - runner: macos-15-intel
            suffix: macOS_amd64
          - runner: macos-15
            suffix: macOS_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}
      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/asapi "dist/asapi_${VERSION}_${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: asapi_${{ env.VERSION }}_${{ matrix.suffix }}
          path: dist/asapi_${{ env.VERSION }}_${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: asapi_${{ env.VERSION }}_*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum asapi_* > "asapi_${VERSION}_checksums.txt"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --clobber
          else
            gh release create "${VERSION}" dist/* \
              --verify-tag \
              --title "asapi ${VERSION}" \
              --generate-notes
          fi
