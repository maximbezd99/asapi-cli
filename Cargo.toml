[workspace]
members = [
    "crates/appstore-api",
    "crates/app",
    "crates/server",
    "crates/cli",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "Public Apple App Store research CLI and local research workspace"
repository = "https://github.com/maximbezd99/asapi-cli"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
include_dir = "0.7"
indoc = "2"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "http2", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = "thin"
